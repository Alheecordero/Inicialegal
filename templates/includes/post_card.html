<article class="post-card">
  <a href="{{ post.get_absolute_url }}" class="thumb" aria-label="{{ post.title }}">
    {% if post.cover_image %}<img src="{{ post.cover_image.url }}" alt="{{ post.title }}" loading="lazy">{% else %}<div class="no-img"><i class="bi bi-journal-text"></i></div>{% endif %}
  </a>
  <div class="body">
    <div class="d-flex justify-content-between align-items-center mb-2">
      {% if post.category %}<a class="cat-badge" href="{{ post.category.get_absolute_url }}" style="background: {{ post.category.color }}">{{ post.category.name }}</a>{% else %}<span></span>{% endif %}
      <span class="post-meta"><i class="bi bi-clock"></i>{{ post.reading_time }} min</span>
    </div>
    <h3><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></h3>
    <p class="excerpt">{{ post.excerpt }}</p>
    <div class="post-meta mt-3 pt-3 border-top">
      <span><i class="bi bi-person"></i>{{ post.author_name }}</span>
      <span><i class="bi bi-calendar3"></i>{{ post.published_at|date:"d M Y" }}</span>
    </div>
  </div>
</article>
