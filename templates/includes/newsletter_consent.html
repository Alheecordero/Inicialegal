{% load i18n core_extras %}
<div class="newsletter-consent">
  <input class="form-check-input" type="checkbox" name="accept" id="{{ consent_id }}" value="on" required>
  <label class="form-check-label" for="{{ consent_id }}">{% if LANGUAGE_CODE == "en" %}I accept that Inicia Legal 360 – Estudio Jurídico SpA may process my email address in order to send me its publications, regulatory circulars and information about its services, in accordance with its <a href="{{ site.privacy_policy_url|default:'/p/privacidad/'|localized_href }}">Privacy Policy</a>. I may unsubscribe at any time through the link included in each message or by writing to <a href="mailto:contacto@inicialegal.cl">contacto@inicialegal.cl</a>.{% else %}Acepto que Inicia Legal 360 – Estudio Jurídico SpA trate mi correo electrónico para enviarme sus publicaciones, circulares normativas e información sobre sus servicios, conforme a su <a href="{{ site.privacy_policy_url|default:'/p/privacidad/' }}">Política de Privacidad</a>. Puedo darme de baja en cualquier momento desde el enlace incluido en cada envío o escribiendo a <a href="mailto:contacto@inicialegal.cl">contacto@inicialegal.cl</a>.{% endif %}</label>
</div>
