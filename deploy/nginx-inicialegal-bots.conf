# Inicia Legal — detección de bots y crawlers (sitio en desarrollo).
# Se instala en /etc/nginx/conf.d/ (contexto http). $il_bad_bot = 1 → 403.
# Para permitir buscadores cuando el sitio salga a producción, eliminar este archivo
# o dejar el map en "default 0" y quitar las líneas de buscadores.

map $http_user_agent $il_bad_bot {
    default 0;
    "" 1;                                   # sin User-Agent

    # Buscadores (bloqueados mientras el sitio está en desarrollo)
    ~*googlebot 1;
    ~*google-inspectiontool 1;
    ~*adsbot-google 1;
    ~*bingbot 1;
    ~*bingpreview 1;
    ~*msnbot 1;
    ~*slurp 1;
    ~*duckduckbot 1;
    ~*baiduspider 1;
    ~*yandex 1;
    ~*sogou 1;
    ~*exabot 1;
    ~*applebot 1;
    ~*amazonbot 1;
    ~*petalbot 1;
    ~*seznambot 1;
    ~*qwantify 1;
    ~*coccocbot 1;

    # Redes sociales / previsualizadores
    ~*facebookexternalhit 1;
    ~*facebot 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*pinterestbot 1;
    ~*whatsapp 1;
    ~*telegrambot 1;
    ~*slackbot 1;
    ~*discordbot 1;

    # SEO / scrapers / archivadores
    ~*ahrefsbot 1;
    ~*semrushbot 1;
    ~*mj12bot 1;
    ~*dotbot 1;
    ~*blexbot 1;
    ~*dataforseobot 1;
    ~*serpstatbot 1;
    ~*megaindex 1;
    ~*ia_archiver 1;
    ~*archive\.org_bot 1;
    ~*censysinspect 1;
    ~*zoominfobot 1;
    ~*barkrowler 1;

    # Rastreadores de IA
    ~*gptbot 1;
    ~*chatgpt-user 1;
    ~*oai-searchbot 1;
    ~*ccbot 1;
    ~*anthropic-ai 1;
    ~*claudebot 1;
    ~*claude-web 1;
    ~*perplexitybot 1;
    ~*bytespider 1;
    ~*google-extended 1;
    ~*meta-externalagent 1;
    ~*cohere-ai 1;
    ~*diffbot 1;
    ~*omgili 1;
    ~*youbot 1;
    ~*timpibot 1;
    ~*img2dataset 1;

    # Herramientas genéricas y librerías HTTP
    ~*python-requests 1;
    ~*python-urllib 1;
    ~*aiohttp 1;
    ~*httpx 1;
    ~*scrapy 1;
    ~*go-http-client 1;
    ~*java/ 1;
    ~*okhttp 1;
    ~*libwww-perl 1;
    ~*lwp-trivial 1;
    ~*node-fetch 1;
    ~*axios 1;
    ~*wget 1;
    ~*curl/ 1;
    ~*httpclient 1;
    ~*nikto 1;
    ~*sqlmap 1;
    ~*masscan 1;
    ~*zgrab 1;
    ~*nmap 1;
    ~*headlesschrome 1;
    ~*phantomjs 1;

    # Excepciones (marcas de teléfonos que contienen "bot")
    ~*cubot 0;

    # Patrones genéricos
    ~*(bot|crawl|crawler|spider|scrap|fetch|harvest|extract)\b 1;
}
