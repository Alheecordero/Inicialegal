# Inicia Legal — bloqueo de scrapers y escáneres.
# Se instala en /etc/nginx/conf.d/ (contexto http). $il_bad_bot = 1 → 403.
# Buscadores y rastreadores de IA no van aquí: los ve Cloudflare (AI Crawl Control)
# y el origen debe responder 200 para que el panel los cuente como permitidos.

map $http_user_agent $il_bad_bot {
    default 0;
    "" 1;                                   # sin User-Agent

    # SEO / scrapers / archivadores
    ~*ahrefsbot 1;
    ~*semrushbot 1;
    ~*mj12bot 1;
    ~*dotbot 1;
    ~*blexbot 1;
    ~*dataforseobot 1;
    ~*serpstatbot 1;
    ~*megaindex 1;
    ~*ia_archiver 1;
    ~*archive\.org_bot 1;
    ~*censysinspect 1;
    ~*zoominfobot 1;
    ~*barkrowler 1;

    # Herramientas genéricas y librerías HTTP
    ~*python-requests 1;
    ~*python-urllib 1;
    ~*aiohttp 1;
    ~*httpx 1;
    ~*scrapy 1;
    ~*go-http-client 1;
    ~*java/ 1;
    ~*okhttp 1;
    ~*libwww-perl 1;
    ~*lwp-trivial 1;
    ~*node-fetch 1;
    ~*axios 1;
    ~*wget 1;
    ~*curl/ 1;
    ~*httpclient 1;
    ~*nikto 1;
    ~*sqlmap 1;
    ~*masscan 1;
    ~*zgrab 1;
    ~*nmap 1;
    ~*headlesschrome 1;
    ~*phantomjs 1;
}

# Scrapers bloqueados igual pueden leer la landing de la bio.
map "$il_bad_bot:$uri" $il_block_bot {
    default $il_bad_bot;
    "~^1:/instagram/?$" 0;
    "~^1:/ig/?$" 0;
}
