# Inicia Legal — Django/Gunicorn (staging, sin indexación, bloqueo de bots)
# Requiere: /etc/nginx/conf.d/inicialegal-bots.conf (map $il_bad_bot)
#           /etc/nginx/cloudflare-real-ip.conf

limit_req_zone $binary_remote_addr zone=il_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=il_static:10m rate=40r/s;
limit_req_zone $binary_remote_addr zone=il_admin:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=il_addr:10m;

# Cloudflare en modo "Flexible" llega por :80 con X-Forwarded-Proto: https → no redirigir.
map $http_x_forwarded_proto $il_redirect_https {
    default 1;
    https   0;
}

# HTTP → HTTPS (y ACME)
server {
    listen 80;
    listen [::]:80;
    server_name inicialegal.cl www.inicialegal.cl;
    include /etc/nginx/cloudflare-real-ip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/inicialegal/public;
        allow all;
    }

    location / {
        if ($il_redirect_https) {
            return 301 https://inicialegal.cl$request_uri;
        }
        if ($il_bad_bot) {
            return 403;
        }
        include /etc/nginx/snippets/inicialegal-proxy.conf;
    }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.inicialegal.cl;

    ssl_certificate /etc/letsencrypt/live/inicialegal.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inicialegal.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://inicialegal.cl$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name inicialegal.cl;
    include /etc/nginx/cloudflare-real-ip.conf;

    ssl_certificate /etc/letsencrypt/live/inicialegal.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inicialegal.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;
    limit_conn il_addr 20;

    # Sitio en desarrollo: no indexar (Django también lo envía; aquí cubre estáticos/media)
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/inicialegal.access.log;
    error_log  /var/log/nginx/inicialegal.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/inicialegal/public;
        allow all;
    }

    # robots.txt accesible para todos (informa el Disallow)
    location = /robots.txt {
        include /etc/nginx/snippets/inicialegal-proxy.conf;
        access_log off;
    }

    # Bots y crawlers bloqueados en el resto del sitio
    if ($il_bad_bot) {
        return 403;
    }

    # Rutas típicas de escaneo
    location ~* ^/(wp-admin|wp-login\.php|wp-content|xmlrpc\.php|\.env|\.git|phpmyadmin|cgi-bin) {
        return 444;
    }

    location /static/ {
        alias /var/www/inicialegal/staticfiles/;
        limit_req zone=il_static burst=60 nodelay;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /media/ {
        alias /var/www/inicialegal/media/;
        limit_req zone=il_static burst=30 nodelay;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # La ruta pública antigua del panel: los escáneres la prueban. No revelar la nueva.
    location ~* ^/admin/?$ {
        return 444;
    }
    location ^~ /admin/ {
        return 444;
    }

    location /gestion/ {
        limit_req zone=il_admin burst=8 nodelay;
        include /etc/nginx/snippets/inicialegal-proxy.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        limit_req zone=il_general burst=30 nodelay;
        include /etc/nginx/snippets/inicialegal-proxy.conf;
    }
}
