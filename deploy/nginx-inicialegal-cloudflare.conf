# Solo Cloudflare puede hablar con el origen (se instala en /etc/nginx/conf.d/inicialegal-cloudflare.conf).
# $realip_remote_addr es la IP que abrió la conexión, antes de que real_ip la reemplace por CF-Connecting-IP.
# Rangos: https://www.cloudflare.com/ips-v4 y https://www.cloudflare.com/ips-v6 (revisados 2026-10-30).

geo $realip_remote_addr $il_from_cloudflare {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;

    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;

    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Let's Encrypt valida directo contra el origen cuando el DNS no pasa por Cloudflare (deploy/issue_cert.sh).
map $request_uri $il_is_acme {
    default 0;
    ~^/\.well-known/acme-challenge/ 1;
}

map "$il_from_cloudflare$il_is_acme" $il_block_direct {
    default 0;
    "00" 1;
}
