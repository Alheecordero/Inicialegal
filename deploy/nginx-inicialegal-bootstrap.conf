# Configuración temporal solo-HTTP para obtener el primer certificado con certbot (webroot).
server {
    listen 80;
    listen [::]:80;
    server_name inicialegal.cl www.inicialegal.cl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/inicialegal/public;
        allow all;
    }

    location / {
        return 503;
    }
}
